esphome:
  name: esp32-ble-server-test

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components:
      - esp32_ble_server

logger:

esp32_ble:
  name: ESPHome BLE Test
  io_capability: display_only
  max_connections: 1

esp32_ble_server:
  manufacturer: ESPHome Components
  model: CI Fixture
  max_clients: 1
  on_connect:
    then:
      - logger.log: BLE client connected
  on_disconnect:
    then:
      - logger.log: BLE client disconnected
  on_pairing_passkey:
    then:
      - logger.log:
          format: "Pairing passkey: %06u"
          args: [static_cast<unsigned int>(passkey)]
  on_pairing_complete:
    then:
      - logger.log:
          format: "Pairing success: %s"
          args: ['success ? "true" : "false"']
  services:
    - uuid: 898a0c20-6d38-4a49-9f84-f942b4cd9380
      advertise: true
      characteristics:
        - id: test_characteristic
          uuid: 898a0c21-6d38-4a49-9f84-f942b4cd9380
          description: Test characteristic
          read: true
          write: true
          notify: true
          value: initial
          descriptors:
            - id: test_descriptor
              uuid: 2903
              read: true
              write: true
              value: descriptor
          on_write:
            then:
              - logger.log:
                  format: "Received %u bytes from connection %u"
                  args: ['static_cast<unsigned int>(x.size())', id]

interval:
  - interval: 60s
    then:
      - ble_server.characteristic.set_value:
          id: test_characteristic
          value: [1, 2, 3]
      - ble_server.descriptor.set_value:
          id: test_descriptor
          value: updated
      - ble_server.characteristic.notify:
          id: test_characteristic
